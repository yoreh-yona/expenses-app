name: Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['.github/nag/**', '.github/workflows/nag.yml', '.github/workflows/pages.yml', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: App version
        id: v
        run: echo "name=$(grep -oP "const VERSION = '\K[^']+" app.js)" >> "$GITHUB_OUTPUT"
      - name: Web assets + Capacitor sync
        working-directory: android-app
        run: |
          npm ci --no-audit --no-fund
          rm -rf www && mkdir www
          cp -r ../index.html ../app.js ../imgproc.js ../xlsx-fill.js ../manifest.json ../whatsnew.json ../vendor ../icons www/
          npx cap sync android
      - name: Build signed APK
        working-directory: android-app/android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android-app/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_PASSWORD is missing – building a debug APK only (no release)"
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/expenses.apk"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/expenses.apk"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: expenses-apk
          path: expenses.apk
      - name: Publish release
        if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" expenses.apk --clobber
          else
            node -e "const w=require('./whatsnew.json');console.log(w.notes.map(n=>'- '+n).join('\\n'))" > notes.md
            gh release create "$TAG" expenses.apk --title "הוצאות $TAG" --notes-file notes.md
          fi
