name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['android-app/**', '.github/nag/**', '.github/workflows/android.yml', '.github/workflows/nag.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect web files
        run: mkdir _site && cp -r index.html app.js imgproc.js xlsx-fill.js sw.js manifest.json .nojekyll whatsnew.json vendor icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
